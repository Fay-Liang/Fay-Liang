# ============================================================
# GitHub 个人主页统计图 —— 在仓库内预生成 SVG
# ------------------------------------------------------------
# 背景：github-readme-stats / activity-graph / trophy 三个服务都托管在
# *.vercel.app，国内访问不通，README 里会显示裂图。
#
# 本 workflow 改为让 GitHub 的服务器去拉取数据、生成 SVG，再提交进本
# 仓库；README 引用仓库内的图片。这样不经过任何第三方服务，不怕对方
# 限流，也不怕被墙。
#
# 【首次使用】推送后到 Actions 页手动点一次 "Run workflow"。
# 在 github-metrics.svg 生成之前，README 里那张图是空白的。
# ============================================================
name: Metrics

on:
  # 每天 10:30（北京时间）刷新一次。
  # 注意 cron 用的是 UTC，所以写 02:30；避开整点以错开 GitHub 的调度高峰。
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:            # 允许手动触发
  push:
    branches: [main]

permissions:
  contents: write               # 需要把生成的 SVG 提交回仓库

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # 为什么不用内置的 GITHUB_TOKEN：
          # 它由 Actions 自动生成，权限被限制在本仓库内。而 plugin_habits /
          # plugin_achievements / plugin_languages 都需要跨仓库读取你所有
          # 仓库的提交历史与语言构成，单仓库 token 查不到，插件会直接抛
          # "Unexpected error"（表现为图里那三处红色报错）。
          # 故改用 PAT，存在仓库 secret 里，名为 METRICS_TOKEN。
          # 未配置时回退到 GITHUB_TOKEN，此时上述三个插件仍会失败。
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Fay-Liang
          template: classic
          config_timezone: Asia/Shanghai
          filename: github-metrics.svg   # 输出到仓库根目录，与 README 同级

          # 基础数据：头部、活跃度、社区、仓库、元信息
          base: header, activity, community, repositories, metadata

          # 语言统计（替代 github-readme-stats 的 top-langs 卡片）
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          # 提交习惯与活跃度（替代 activity-graph 活动图）
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # 成就徽章（替代 github-profile-trophy 奖杯）
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
